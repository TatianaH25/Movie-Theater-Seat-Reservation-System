name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JUnit
        run: |
          curl -L -o junit-platform-console-standalone.jar \
          https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.13.3/junit-platform-console-standalone-1.13.3.jar

      - name: Compile Java files
        run: |
          mkdir -p out
          javac -cp junit-platform-console-standalone.jar -d out $(find . -maxdepth 1 -name "*.java" ! -name "module-info.java")

      - name: Run unit tests
        run: |
          java -jar junit-platform-console-standalone.jar execute \
          --class-path out \
          --scan-class-path
